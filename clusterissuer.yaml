apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Use staging to avoid hitting Let's Encrypt rate limits while testing
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: test@yourdomain.com # Or test@gmail.com # <--- CHANGE THIS to your actual email
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx