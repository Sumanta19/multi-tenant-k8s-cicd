apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-app-hpa
  namespace: user1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-app
  minReplicas: 2
  maxReplicas: 6 # Set higher than our quota limit to test the blockage
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # Scale up instantly
    scaleDown:
      stabilizationWindowSeconds: 300 # Wait 5 minutes before scaling down
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50